<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Server Error - CardioGuard AI</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom Glass Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="container text-center">
        <div class="glass-card d-inline-block p-5" style="max-width: 600px;">
            <div class="text-danger mb-4">
                <i class="bi bi-bug-fill display-1"></i>
            </div>
            <h1 class="display-5 fw-bold mb-3">500</h1>
            <h2 class="fw-bold mb-3 text-secondary">Internal Server Error</h2>
            
            {% if error %}
                <div class="alert alert-danger text-start small border-danger bg-danger bg-opacity-10 mb-4" role="alert" style="overflow-x: auto; white-space: pre-wrap; font-family: monospace;">
                    <i class="bi bi-terminal-fill me-2"></i><strong>Diagnostics:</strong><br>{{ error }}
                </div>
            {% else %}
                <p class="text-secondary mb-4">An unexpected error occurred during prediction inference or report assembly.</p>
            {% endif %}
            
            <a class="btn btn-primary px-4 py-2" href="{{ url_for('index') }}">
                <i class="bi bi-house-door-fill me-1"></i> Return to Dashboard
            </a>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom Scripts -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
